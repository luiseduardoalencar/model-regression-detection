[project]
name = "regression-detector"
version = "0.1.0"
description = "Quality gate that detects regressions in an LLM email classifier against a golden dataset."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepeval>=4.3.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langfuse>=5.1.0",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
validate-golden = "regression_detector.golden.cli:main"
audit-labels = "regression_detector.golden.audit_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regression_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real OpenAI API and spends money; run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
